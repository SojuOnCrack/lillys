<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#100d28">
<meta name="description" content="Every day, something beautiful grows. A quiet little garden, growing one lily at a time.">
<title>Growing Love — A garden of us</title>
<style>
:root{color-scheme:dark;--ink:#fff8ff;--muted:#d5c8e9;--line:rgba(255,238,255,.2)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#100d28;color:var(--ink);font-family:Georgia,"Times New Roman",serif}body{overflow:hidden}.scene{position:relative;isolation:isolate;min-height:100svh;overflow:hidden;background:linear-gradient(180deg,#0d102c 0%,#25204e 35%,#76416e 66%,#f08a91 83%,#271e42 100%)}#garden{position:absolute;inset:0;width:100%;height:100%;z-index:-1;touch-action:pan-y}.nebula{position:absolute;inset:-20%;z-index:-1;pointer-events:none;background:radial-gradient(ellipse at 72% 28%,rgba(185,102,203,.2),transparent 29%),radial-gradient(ellipse at 25% 37%,rgba(86,93,191,.22),transparent 36%);filter:blur(24px);animation:nebula 24s ease-in-out infinite alternate}.grain{position:absolute;inset:0;pointer-events:none;opacity:.07;z-index:1;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.45'/%3E%3C/svg%3E")}.content{position:relative;z-index:2;display:flex;min-height:100svh;flex-direction:column;align-items:center;text-align:center;padding:clamp(24px,5vh,58px) 22px 24px;pointer-events:none}.eyebrow{font:600 10px/1.5 system-ui,sans-serif;letter-spacing:.32em;text-transform:uppercase;color:#f4cce9;text-shadow:0 0 18px #df8bdc;margin:0 0 17px}.title{font-size:clamp(2.8rem,7.3vw,6.2rem);font-weight:400;line-height:.98;letter-spacing:-.055em;margin:0;text-shadow:0 3px 40px rgba(20,8,39,.36)}.title em{font-weight:400;color:#f8c2e2}.subtitle{font-size:clamp(.95rem,1.5vw,1.12rem);font-style:italic;color:#f0deef;margin:18px 0 28px;text-shadow:0 2px 16px #382044}.counter{pointer-events:auto;width:min(340px,calc(100vw - 44px));padding:18px 24px 17px;border:1px solid var(--line);border-radius:18px;background:linear-gradient(135deg,rgba(255,245,255,.11),rgba(255,255,255,.025));box-shadow:0 14px 54px rgba(11,7,35,.15),inset 0 1px 0 rgba(255,255,255,.12);backdrop-filter:blur(15px);-webkit-backdrop-filter:blur(15px)}.count-number{font-size:clamp(3rem,6vw,4.4rem);line-height:1;letter-spacing:-.05em;font-variant-numeric:tabular-nums;text-shadow:0 0 34px rgba(245,174,224,.2)}.count-label{font:500 10px/1.6 system-ui,sans-serif;letter-spacing:.24em;text-transform:uppercase;color:#e5d4f0;margin-top:8px}.rule{height:1px;background:linear-gradient(90deg,transparent,rgba(255,224,255,.32),transparent);margin:15px 0 12px}.start-date{font:12px/1.6 system-ui,sans-serif;color:#e2d4ee}.elapsed{font:11px/1.6 system-ui,sans-serif;color:#c6b6d9;margin-top:4px;font-variant-numeric:tabular-nums}.footer{position:absolute;z-index:3;bottom:clamp(20px,4vh,42px);left:0;right:0;text-align:center;padding:0 20px;pointer-events:none}.footer p{font-size:clamp(.92rem,1.5vw,1.15rem);font-style:italic;color:#f7e2f1;text-shadow:0 2px 18px #21152e;margin:0 0 12px}.hint{font:10px/1.6 system-ui,sans-serif;letter-spacing:.12em;color:rgba(255,244,255,.72)}.detail{position:fixed;z-index:5;left:50%;bottom:24px;transform:translate(-50%,16px);width:min(320px,calc(100vw - 32px));padding:14px 17px;border:1px solid var(--line);border-radius:14px;background:rgba(20,14,43,.78);backdrop-filter:blur(18px);box-shadow:0 14px 44px #09071955;opacity:0;visibility:hidden;transition:opacity .25s,transform .25s,visibility .25s;text-align:left}.detail.visible{opacity:1;visibility:visible;transform:translate(-50%,0)}.detail strong{font-weight:400;font-size:1.1rem}.detail p{font:12px/1.6 system-ui,sans-serif;color:#d7c8e8;margin:5px 0 0}.detail button{position:absolute;right:9px;top:8px;background:transparent;border:0;color:#eadcf4;font-size:20px;cursor:pointer;padding:4px 8px}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}@keyframes nebula{from{transform:translate3d(-1%,0,0) scale(1)}to{transform:translate3d(1.5%,-1%,0) scale(1.06)}}@media(max-height:720px) and (min-width:600px){.content{padding-top:24px}.subtitle{margin:12px 0 16px}.counter{padding:14px 22px}.footer{bottom:16px}}@media(max-width:600px){.content{padding-top:clamp(27px,7vh,58px)}.eyebrow{font-size:9px;letter-spacing:.23em}.title{font-size:clamp(3rem,14vw,5rem)}.subtitle{max-width:280px;line-height:1.5;margin:16px 0 23px}.counter{padding:17px 20px}.footer{bottom:19px}.footer p{max-width:300px;margin:0 auto 10px;line-height:1.5}.hint{font-size:9px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<main class="scene" id="scene">
<canvas id="garden" aria-label="An interactive meadow of lilies. Select a flower to discover its day."></canvas>
<div class="nebula" aria-hidden="true"></div><div class="grain" aria-hidden="true"></div>
<section class="content" aria-label="Our relationship garden">
<p class="eyebrow">A little universe, just for us</p><h1 class="title">Growing <em>Love</em></h1>
<p class="subtitle">A garden that grows with every day we share.</p>
<div class="counter" aria-live="off"><div class="count-number" id="day-count">—</div><div class="count-label">days of us</div><div class="rule"></div><div class="start-date" id="start-date">Set your start date in the configuration.</div><div class="elapsed" id="elapsed" hidden></div></div>
</section>
<footer class="footer"><p>Every day, something beautiful grows.</p><div class="hint">✧ &nbsp; Touch a lily to find its day &nbsp; ✧</div></footer>
<aside class="detail" id="detail" aria-live="polite" aria-atomic="true"><button id="close-detail" type="button" aria-label="Close flower details">×</button><strong id="detail-title">A little moment</strong><p id="detail-copy"></p></aside><p class="sr-only" id="garden-status" aria-live="polite"></p>
</main>
<script>
/* GROWING LOVE CONFIG — set the real first calendar day together (YYYY-MM-DD). */
const CONFIG = {
  relationshipStartDate: "", // Example: "2024-06-15" — start date counts as Day 1
  message: "Every day, something beautiful grows.",
  showElapsedClock: false,
  showStartDate: true,
  palette: { skyTop:"#0d102c", twilight:"#76416e", horizon:"#f08a91", meadow:"#19152f", glow:"#f5b5e4" },
  distribution: { depthBias:1.7, density:1, maxRenderedFlowers:12000 },
  species: [
    {id:"white",name:"White lily",weight:25,color:"#fff8f1",inner:"#f8ddec"},
    {id:"oriental",name:"Pink oriental lily",weight:22,color:"#f6a2d0",inner:"#fff0f7"},
    {id:"red",name:"Crimson lily",weight:17,color:"#c92758",inner:"#fa779e"},
    {id:"madonna",name:"Madonna lily",weight:14,color:"#fffdf7",inner:"#f4f0df"},
    {id:"tiger",name:"Tiger lily",weight:8,color:"#f58c42",inner:"#ffd17b"},
    {id:"spider",name:"Red spider lily",weight:8,color:"#df315e",inner:"#ff8aaf"},
    {id:"violet",name:"Violet dream lily",weight:6,color:"#b99bfa",inner:"#f0d5ff"}
  ],
  motion:{parallax:true,growNewestFlower:true}
};
const canvas=document.getElementById("garden"),ctx=canvas.getContext("2d",{alpha:false}),scene=document.getElementById("scene"),reducedMotion=matchMedia("(prefers-reduced-motion: reduce)").matches;
const state={width:0,height:0,dpr:1,flowers:[],stars:[],particles:[],offsetX:0,offsetY:0,selected:null,firstPaint:0};
function hash(n){let x=(n|0)+0x6D2B79F5;x=Math.imul(x^(x>>>15),x|1);x^=x+Math.imul(x^(x>>>7),x|61);return((x^(x>>>14))>>>0)/4294967296}
function rng(seed){let n=seed>>>0;return()=>{n=(n+0x6D2B79F9)|0;let t=n;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296}}
function parseDate(value){const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(value);if(!m)return null;const d=new Date(Date.UTC(+m[1],+m[2]-1,+m[3]));return d.getUTCFullYear()===+m[1]&&d.getUTCMonth()===+m[2]-1&&d.getUTCDate()===+m[3]?d:null}
function localDateKey(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function relationshipDay(now=new Date()){const start=parseDate(CONFIG.relationshipStartDate);if(!start)return{error:"Set CONFIG.relationshipStartDate to your real start date (YYYY-MM-DD)."};const today=parseDate(localDateKey(now)),days=Math.floor((today-start)/86400000)+1;return days<1?{error:"The configured start date is in the future."}:{days,start}}
function speciesFor(day){const total=CONFIG.species.reduce((s,f)=>s+f.weight,0);let pick=hash(day*7919+31)*total;for(const f of CONFIG.species){pick-=f.weight;if(pick<0)return f}return CONFIG.species[0]}
function makeFlower(day){const r=rng(day*2654435761),depth=Math.pow(r(),CONFIG.distribution.depthBias);return{day,species:speciesFor(day),x:r(),depth,size:.42+depth*1.38,lean:(r()-.5)*.28,seed:r()}}
function makeSky(){const r=rng(1771);state.stars=Array.from({length:Math.round(state.width*state.height/5000)},()=>({x:r(),y:r()*.61,r:.3+r()*1.35,a:.18+r()*.65,phase:r()*7}));state.particles=Array.from({length:42},()=>({x:r(),y:.28+r()*.68,r:.5+r()*1.5,a:.08+r()*.3,phase:r()*7,speed:.00008+r()*.0002}))}
function resize(){const r=scene.getBoundingClientRect();state.width=r.width;state.height=r.height;state.dpr=Math.min(devicePixelRatio||1,1.7);canvas.width=Math.round(state.width*state.dpr);canvas.height=Math.round(state.height*state.dpr);ctx.setTransform(state.dpr,0,0,state.dpr,0,0);makeSky();draw()}
function petal(len,width,angle,fill,highlight,curve=0){ctx.save();ctx.rotate(angle);ctx.beginPath();ctx.moveTo(0,0);ctx.bezierCurveTo(-width*.95,-len*.28,-width*.75,-len*.8,curve,-len);ctx.bezierCurveTo(width*.8,-len*.8,width*1.1,-len*.28,0,0);ctx.closePath();ctx.fillStyle=fill;ctx.fill();ctx.strokeStyle=highlight;ctx.globalAlpha*=.62;ctx.lineWidth=.65;ctx.stroke();ctx.restore()}
function drawLily(f,x,y,s){const sp=f.species;ctx.save();ctx.translate(x,y);ctx.rotate(f.lean);if(sp.id==="spider"){for(let i=0;i<7;i++){ctx.save();ctx.rotate(i*Math.PI*2/7);ctx.beginPath();ctx.moveTo(0,0);ctx.bezierCurveTo(-s*3,-s*13,-s*11,-s*25,s*2,-s*31);ctx.bezierCurveTo(s*10,-s*24,s*4,-s*9,0,0);ctx.strokeStyle=sp.color;ctx.lineWidth=Math.max(.8,s*1.25);ctx.stroke();ctx.restore()}for(let i=0;i<8;i++){ctx.save();ctx.rotate(i*Math.PI/4);ctx.beginPath();ctx.moveTo(0,-s*2);ctx.bezierCurveTo(s*5,-s*15,s,-s*27,s*8,-s*36);ctx.strokeStyle=sp.inner;ctx.lineWidth=Math.max(.5,s*.65);ctx.stroke();ctx.beginPath();ctx.arc(s*8,-s*36,s*.8,0,Math.PI*2);ctx.fillStyle="#ffd9ec";ctx.fill();ctx.restore()}}else{const n=sp.id==="oriental"?8:6;for(let i=0;i<n;i++)petal((sp.id==="oriental"?26:22)*s*(.85+(i%2)*.13),(sp.id==="oriental"?7.2:6.2)*s,i*Math.PI*2/n,sp.color,sp.inner,(f.seed-.5)*2);if(sp.id==="oriental")for(let i=0;i<5;i++)petal(19*s,5*s,i*Math.PI*2/5+Math.PI/5,"#ffd4e9",sp.inner);if(sp.id==="tiger")for(let i=0;i<28;i++){const a=i*2.399,rad=(4+(i%5)*2.5)*s;ctx.beginPath();ctx.ellipse(Math.cos(a)*rad,-s*13+Math.sin(a)*rad*.55,s*.8,s*1.25,a,0,Math.PI*2);ctx.fillStyle="#582b37";ctx.fill()}for(let i=0;i<6;i++){const a=i*Math.PI/3;ctx.beginPath();ctx.moveTo(0,-s*2);ctx.quadraticCurveTo(Math.cos(a)*s*9,-s*15+Math.sin(a)*s*9,Math.cos(a)*s*15,-s*21+Math.sin(a)*s*10);ctx.strokeStyle=sp.id==="red"?"#ffd3b4":"#ffe9ac";ctx.lineWidth=Math.max(.6,s*.55);ctx.stroke();ctx.beginPath();ctx.arc(Math.cos(a)*s*15,-s*21+Math.sin(a)*s*10,s*1.2,0,Math.PI*2);ctx.fillStyle="#ffdf9b";ctx.fill()}}ctx.restore()}
function point(f){const w=state.width,h=state.height,y=h*.64+Math.pow(f.depth,1.65)*(h*.47),perspective=.24+f.depth*.9,spread=w*(.02+f.depth*.06),x=f.x*w+Math.sin(f.day*12.9898)*spread;return{x,y,size:(4+f.size*9)*perspective,alpha:.25+f.depth*.75,stem:Math.max(8,25*perspective),depth:f.depth}}
function drawFlower(f){const p=point(f);if(p.x< -40||p.x>state.width+40||p.y<state.height*.61||p.y>state.height+30)return;const x=p.x+state.offsetX*p.depth*10,y=p.y+state.offsetY*p.depth*5,s=p.size;ctx.save();ctx.globalAlpha=p.alpha;const top=y-p.stem;ctx.beginPath();ctx.moveTo(x,y+3);ctx.quadraticCurveTo(x-2*s,y-p.stem*.48,x+f.lean*s,top);ctx.strokeStyle="#4d795c";ctx.lineWidth=Math.max(.65,s*.22);ctx.stroke();ctx.beginPath();ctx.moveTo(x,y-p.stem*.48);ctx.quadraticCurveTo(x-7*s,y-p.stem*.56,x-8*s,y-p.stem*.76);ctx.quadraticCurveTo(x-s,y-p.stem*.69,x,y-p.stem*.48);ctx.fillStyle="#47765e";ctx.fill();ctx.beginPath();ctx.moveTo(x,y-p.stem*.36);ctx.quadraticCurveTo(x+7*s,y-p.stem*.53,x+8*s,y-p.stem*.68);ctx.quadraticCurveTo(x+s,y-p.stem*.62,x,y-p.stem*.36);ctx.fill();const by=top-s;ctx.globalAlpha=p.alpha*(.16+f.depth*.6);ctx.beginPath();ctx.arc(x,by,s*7,0,Math.PI*2);ctx.fillStyle=f.species.color;ctx.shadowBlur=s*7;ctx.shadowColor=f.species.color;ctx.fill();ctx.shadowBlur=0;ctx.globalAlpha=p.alpha;drawLily(f,x,by,s*.65);ctx.restore();f.hit={x,y:by,r:Math.max(9,s*8)}}
function draw(now=performance.now()){const w=state.width,h=state.height;if(!w||!h)return;const sky=ctx.createLinearGradient(0,0,0,h);sky.addColorStop(0,"#0c102c");sky.addColorStop(.36,"#29244f");sky.addColorStop(.63,"#8c4f79");sky.addColorStop(.76,"#ef9a9d");sky.addColorStop(1,"#17142d");ctx.fillStyle=sky;ctx.fillRect(0,0,w,h);const g=ctx.createRadialGradient(w*.56,h*.67,1,w*.56,h*.67,h*.31);g.addColorStop(0,"rgba(255,202,180,.72)");g.addColorStop(.22,"rgba(255,160,180,.22)");g.addColorStop(1,"rgba(255,160,180,0)");ctx.fillStyle=g;ctx.fillRect(0,h*.32,w,h*.55);for(const s of state.stars){ctx.globalAlpha=s.a*(.82+.18*Math.sin(now*.0005+s.phase));ctx.fillStyle="#fff0ff";ctx.beginPath();ctx.arc(s.x*w,s.y*h,s.r,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;ctx.fillStyle="#3d2b55";ctx.beginPath();ctx.moveTo(0,h*.69);for(let x=0;x<=w+10;x+=Math.max(12,w/28))ctx.lineTo(x,h*(.65+Math.sin(x*.009)*.018+Math.sin(x*.021)*.009));ctx.lineTo(w,h);ctx.lineTo(0,h);ctx.fill();ctx.fillStyle="#28203f";ctx.beginPath();ctx.moveTo(0,h*.75);for(let x=0;x<=w+10;x+=Math.max(12,w/25))ctx.lineTo(x,h*(.72+Math.sin(x*.007+2)*.022+Math.sin(x*.025)*.008));ctx.lineTo(w,h);ctx.lineTo(0,h);ctx.fill();const meadow=ctx.createLinearGradient(0,h*.68,0,h);meadow.addColorStop(0,"#33203f");meadow.addColorStop(.38,"#211a37");meadow.addColorStop(1,"#101126");ctx.fillStyle=meadow;ctx.fillRect(0,h*.7,w,h*.3);for(const p of state.particles){const x=((p.x*w+now*p.speed*w)%w+w)%w;ctx.globalAlpha=p.a*(.7+.3*Math.sin(now*.001+p.phase));ctx.fillStyle="#f8c8e9";ctx.beginPath();ctx.arc(x,p.y*h,p.r,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;for(let i=0;i<Math.min(700,Math.round(w*.55));i++){const r=hash(i*19+99),x=r*w,y=h*(.72+r*.3);ctx.globalAlpha=.12+r*.19;ctx.strokeStyle=r>.5?"#9b7d9d":"#7b9b8c";ctx.lineWidth=.5;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+(r-.5)*5,y-2-r*7);ctx.stroke()}ctx.globalAlpha=1;for(const f of state.flowers)drawFlower(f);if(state.flowers.length&&CONFIG.motion.growNewestFlower&&!reducedMotion){const p=state.flowers[state.flowers.length-1].hit;if(p){const age=Math.min(1,(performance.now()-state.firstPaint)/1600);if(age<1){ctx.globalAlpha=(1-age)*.4;ctx.beginPath();ctx.arc(p.x,p.y,p.r*(1+age*2),0,Math.PI*2);ctx.strokeStyle="#ffd7f1";ctx.lineWidth=1.5;ctx.stroke();ctx.globalAlpha=1;requestAnimationFrame(draw)}}}}
function initGarden(){const info=relationshipDay(),count=document.getElementById("day-count");if(info.error){count.textContent="—";document.getElementById("start-date").textContent=info.error;document.getElementById("garden-status").textContent=info.error;state.flowers=[];draw();return}state.flowers=Array.from({length:Math.min(info.days,CONFIG.distribution.maxRenderedFlowers)},(_,i)=>makeFlower(i+1));if(info.days>CONFIG.distribution.maxRenderedFlowers)state.flowers[state.flowers.length-1]=makeFlower(info.days);count.textContent=info.days.toLocaleString("de-DE");document.getElementById("start-date").textContent=CONFIG.showStartDate?"Seit dem "+info.start.toLocaleDateString("de-DE",{day:"numeric",month:"long",year:"numeric"}):"";document.getElementById("elapsed").hidden=!CONFIG.showElapsedClock;document.querySelector(".footer p").textContent=CONFIG.message;state.firstPaint=performance.now();draw(state.firstPaint)}
function showFlower(f){document.getElementById("detail-title").textContent="Day "+f.day+" · "+f.species.name;document.getElementById("detail-copy").textContent=f.day===1?"The first little bloom. The beginning of your garden.":"A flower for day "+f.day+" of your story.";document.getElementById("detail").classList.add("visible");state.selected=f.day}
function hideDetail(){document.getElementById("detail").classList.remove("visible");state.selected=null}
canvas.addEventListener("click",e=>{const r=canvas.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;let best=null,dist=Infinity;for(const f of state.flowers){if(!f.hit)continue;const d=Math.hypot(f.hit.x-x,f.hit.y-y);if(d<f.hit.r+8&&d<dist){best=f;dist=d}}if(best)showFlower(best);else hideDetail()});document.getElementById("close-detail").addEventListener("click",hideDetail);
scene.addEventListener("pointermove",e=>{if(reducedMotion||!CONFIG.motion.parallax||e.pointerType==="touch")return;const r=scene.getBoundingClientRect();state.offsetX=(e.clientX-r.left)/r.width-.5;state.offsetY=(e.clientY-r.top)/r.height-.5;draw()});scene.addEventListener("pointerleave",()=>{state.offsetX=state.offsetY=0;draw()});
function tickClock(){if(CONFIG.showElapsedClock){const info=relationshipDay();if(!info.error){const ms=Math.max(0,Date.now()-info.start.getTime()),d=Math.floor(ms/86400000),h=Math.floor(ms%86400000/3600000),m=Math.floor(ms%3600000/60000),s=Math.floor(ms%60000/1000);document.getElementById("elapsed").textContent=d+"d · "+h+"h · "+m+"m · "+s+"s"}}}
new ResizeObserver(resize).observe(scene);resize();initGarden();setInterval(()=>{const info=relationshipDay();if(!info.error&&info.days!==state.flowers.length)initGarden();tickClock()},1000);
</script>
</body>
</html>
